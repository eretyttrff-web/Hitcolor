
name: Build HitColor

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Extract project
        run: unzip -q ShieldTap-Fabric-1.21.11-source.zip -d project

      - name: Build mod
        working-directory: project/ShieldTap
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: HitColor-JAR
          path: project/ShieldTap/build/libs/*.jar
          
